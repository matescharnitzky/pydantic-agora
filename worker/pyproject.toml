[project]
name = "agora-worker"
version = "0.1.0"
description = "Agora worker service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dbos[otel]>=2.31.1,<3",
    "logfire>=4.41,<5",
    "psycopg[binary]>=3.2,<4",
    "pydantic-ai-slim[dbos,openai,typesafe]>=2.63,<3",
    "pydantic-ai-harness>=0.63,<0.64",
    "pydantic-settings>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
