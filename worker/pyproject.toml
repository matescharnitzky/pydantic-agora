[project]
name = "agora-worker"
version = "0.1.0"
description = "Agora worker service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dbos>=2.31.1,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
