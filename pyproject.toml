[dependency-groups]
dev = [
  "httpx2>=2.16,<3",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv.workspace]
members = ["api", "worker"]

[tool.ruff]
src = ["api/src", "worker/src"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["api/src", "api/tests", "worker/src", "worker/tests"]
extraPaths = ["api/src", "worker/src"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "worker/tests"]
markers = ["integration: requires a running PostgreSQL database"]
