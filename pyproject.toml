[dependency-groups]
dev = [
  "httpx2>=2.16,<3",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv.workspace]
members = ["api", "worker"]

[tool.ruff]
src = ["api/src", "worker/src"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "D101", "D102", "D103", "D200", "D205"]

[tool.ruff.lint.per-file-ignores]
# Require task class/method/function docstrings, single-line brevity, and summary separation.
# Other application code and tests are outside this initial scope.
"!worker/src/agora_worker/tasks/**" = ["D"]

# Simple data models use inline D101 exemptions; their behavioral helpers still need docs.
# Ruff already exempts @typing.override methods that inherit their documentation.

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["api/src", "api/tests", "worker/src", "worker/tests"]
extraPaths = ["api/src", "worker/src"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "worker/tests"]
markers = ["integration: requires a running PostgreSQL database"]
