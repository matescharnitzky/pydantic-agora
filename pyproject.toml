[dependency-groups]
dev = [
  "httpx2>=2.16,<3",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv.workspace]
members = ["api", "worker"]

[tool.ruff]
src = ["api/src", "worker/src"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Require public function/method docs and concise formatting across Python code.
# Class docs are optional so simple data models need no boilerplate or exemptions.
# Ruff natively exempts @typing.override methods that inherit their documentation.
select = ["E", "F", "I", "UP", "B", "ASYNC", "D102", "D103", "D200", "D205"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["api/src", "api/tests", "worker/src", "worker/tests"]
extraPaths = ["api/src", "worker/src"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "worker/tests"]
markers = ["integration: requires a running PostgreSQL database"]
