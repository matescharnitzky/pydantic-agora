[project]
name = "agora-api"
version = "0.1.0"
description = "Agora API service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "dbos>=2.31.1,<3",
  "fastapi>=0.115,<1",
  "jsonschema>=4.25,<5",
  "logfire[fastapi]>=4.41,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
