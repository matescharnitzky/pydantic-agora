name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --locked
      - run: uv run --all-packages --locked ruff check .
      - run: uv run --all-packages --locked ruff format --check .
      - run: uv run --all-packages --locked pyright
      - run: uv run --all-packages --locked pytest -m 'not integration'

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "11.25.0"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test

  stack:
    name: Compose / integration / black-box
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "11.25.0"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: tests/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - run: pnpm --dir tests install --frozen-lockfile
      - run: pnpm --dir tests typecheck
      - run: pnpm --dir tests exec playwright install --with-deps chromium
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Database integration tests
        env:
          DATABASE_URL: postgresql://agora:agora-local@127.0.0.1:5432/agora
        run: |
          uv run --all-packages --locked pytest -m integration
          docker compose exec -T worker python -m agora_worker --check
      - run: pnpm --dir tests test:api
      - run: pnpm --dir tests test:e2e
      - name: Service diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: tests/test-results
          retention-days: 7
      - name: Stop services
        if: always()
        run: docker compose down
